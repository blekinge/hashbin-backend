services:
  db:
    image: postgres:16-alpine
    container_name: hashbin-postgres
    environment:
      POSTGRES_DB: hashbin
      POSTGRES_USER: hashbin
      POSTGRES_PASSWORD: hashbin
    ports:
      - "5433:5432"
    volumes:
      - hashbin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashbin -d hashbin"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hashbin-db-data:
