# ── HTTP ───────────────────────────────────────────────────────────────
# All JAX-RS resources are mounted under /api (matching the original Edge
# Function base path: .../functions/v1/api/stamp, /verify, /my-timestamps,
# /health) so the existing React app and Python CLI work unchanged.
#
# We use quarkus.rest.path (the JAX-RS base) rather than quarkus.http.root-path
# because root-path is not applied under @QuarkusTest, whereas the JAX-RS base
# path is routed identically in dev, test and prod. This also keeps the
# management endpoints at /q/openapi and /q/swagger-ui.
quarkus.rest.path=/api

# CORS mirrors the original Hono cors() config.
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=authorization,apikey,content-type,x-client-info,x-supabase-client-platform,x-supabase-client-platform-version,x-supabase-client-runtime,x-supabase-client-runtime-version

# ── Datasource ─────────────────────────────────────────────────────────
# Dev + test use Quarkus Dev Services: with no JDBC URL below, it starts a
# throwaway PostgreSQL in a container automatically. Production reads its
# connection details from env vars (see the %prod lines at the bottom).
#
# Engine note: on this host the container engine is **Podman** (rootless), not
# Docker. Docker Engine 29 rejects the Docker API version that Testcontainers
# 1.20.6 (bundled with Quarkus 3.20.1) negotiates (client v1.32 < daemon minimum
# v1.40), so Dev Services cannot start against Docker. Podman's Docker-compatible
# API ignores the version prefix and accepts v1.32. The machine-wide
# ~/.testcontainers.properties points Testcontainers at the rootless Podman socket
# (docker.host=unix://$XDG_RUNTIME_DIR/podman/podman.sock) and disables Ryuk, so
# plain `mvn test` / `mvn quarkus:dev` just work. On an unconfigured machine, export
# DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock and
# TESTCONTAINERS_RYUK_DISABLED=true before running.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Fallback — pin an explicit external database instead of Dev Services (any
# reachable PostgreSQL). Setting a JDBC URL disables Dev Services for the
# datasource, so uncomment and point at your own server:
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
# quarkus.datasource.username=...
# quarkus.datasource.password=...

%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# ── Hibernate / Flyway ──────────────────────────────────────────────────
# Schema is owned by Flyway migrations; Hibernate must not generate it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true

# ── OpenAPI / Swagger UI ────────────────────────────────────────────────
# Spec at /q/openapi, UI at /q/swagger-ui (non-application root path).
quarkus.smallrye-openapi.info-title=Hashbin API
quarkus.smallrye-openapi.info-version=2.0.0
quarkus.smallrye-openapi.info-description=Trusted file timestamping service. Hash files client-side (MD5, SHA-1, SHA-256, SHA-512), store HMAC-signed timestamps server-side.
quarkus.smallrye-openapi.info-contact-url=https://hashbin.net
quarkus.swagger-ui.always-include=true

# ── Application config ────────────────────────────────────────────────
# HMAC secret used to sign "{hash_sha256}:{created_at}".
# Dev-only default; override HASHBIN_HMAC_SECRET in production.
hashbin.hmac.secret=${HASHBIN_HMAC_SECRET:dev-only-insecure-secret-change-me}

# Native auth (Phase 6): the service issues and verifies its own HS256 JWTs.
# Override HASHBIN_JWT_SECRET in production; any length is accepted (the MAC key
# is SHA-256(secret)). A wrong secret simply fails token verification.
hashbin.auth.jwt-secret=${HASHBIN_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-0123456789}
hashbin.auth.jwt-issuer=${HASHBIN_JWT_ISSUER:hashbin}
hashbin.auth.token-ttl-minutes=${HASHBIN_JWT_TTL_MINUTES:1440}
